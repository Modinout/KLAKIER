services:
  baza:
    image: public.ecr.aws/docker/library/postgres:17
    environment:
      POSTGRES_USER: klakier
      POSTGRES_PASSWORD: ${HASLO_BAZY}
      POSTGRES_DB: klakier
    volumes:
      - ./baza/schemat.sql:/docker-entrypoint-initdb.d/schemat.sql:ro
      - ./baza/dane_pokazowe.sql.gz:/docker-entrypoint-initdb.d/z_dane_pokazowe.sql.gz:ro
      - dane_bazy:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U klakier"]
      interval: 2s
      retries: 15
    restart: unless-stopped

  ai:
    build: ./ai
    environment:
      DUZY_MODEL_URL: ${DUZY_MODEL_URL:-}
      DUZY_MODEL_NAZWA: ${DUZY_MODEL_NAZWA:-}
      DUZY_MODEL_KLUCZ: ${DUZY_MODEL_KLUCZ:-}
    volumes:
      - stan_ai:/app/stan
    healthcheck: &zdrowie
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/zdrowie')"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  odczyt:
    build: ./odczyt
    healthcheck: *zdrowie
    restart: unless-stopped

  api:
    build: ./api
    environment:
      BAZA_URL: postgresql://klakier:${HASLO_BAZY}@baza/klakier
      AI_URL: http://ai:8000
      ODCZYT_URL: http://odczyt:8000
      KOLEJKA_URL: redis://kolejka:6379/0
    # Oba adresy lokalne: localhost może najpierw wskazać ::1, a brak odpowiedzi na ::1 opóźnia każde zapytanie.
    ports:
      - "127.0.0.1:8000:8000"
      - "[::1]:8000:8000"
    healthcheck: *zdrowie
    restart: unless-stopped
    depends_on:
      baza:
        condition: service_healthy
      ai:
        condition: service_healthy

  front:
    build: ./front
    ports:
      - "127.0.0.1:8080:80"
      - "[::1]:8080:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  zbieracz:
    build: ./zbieracz
    profiles: [zbieracz]
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  patrol:
    build:
      context: ./zbieracz
      dockerfile: Dockerfile.patrol
    profiles: [patrol]
    environment:
      API_URL: http://api:8000
      KOLEJKA_URL: redis://kolejka:6379/0
      ZBIERACZ_USER_AGENTS: ${ZBIERACZ_USER_AGENTS:-}
      ZBIERACZ_PROXY: ${ZBIERACZ_PROXY:-}
    depends_on:
      api:
        condition: service_healthy

  kolejka:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped

  robotnik:
    build:
      context: ./zbieracz
      dockerfile: Dockerfile.patrol
    profiles: [patrol]
    command: ["python", "robotnik.py"]
    environment:
      API_URL: http://api:8000
      KOLEJKA_URL: redis://kolejka:6379/0
      ZBIERACZ_USER_AGENTS: ${ZBIERACZ_USER_AGENTS:-}
      ZBIERACZ_PROXY: ${ZBIERACZ_PROXY:-}
    restart: unless-stopped
    depends_on:
      kolejka:
        condition: service_started
      api:
        condition: service_healthy

  sprawdzacz:
    build:
      context: ./zbieracz
      dockerfile: Dockerfile.patrol
    command: ["python", "robotnik.py", "linki"]
    environment:
      API_URL: http://api:8000
      KOLEJKA_URL: redis://kolejka:6379/0
      ZBIERACZ_USER_AGENTS: ${ZBIERACZ_USER_AGENTS:-}
      ZBIERACZ_PROXY: ${ZBIERACZ_PROXY:-}
    restart: unless-stopped
    depends_on:
      kolejka:
        condition: service_started
      api:
        condition: service_healthy

  harmonogram:
    build:
      context: ./zbieracz
      dockerfile: Dockerfile.patrol
    profiles: [patrol]
    command: ["sh", "-c", "printenv | grep -E '^(API_URL|KOLEJKA_URL|META_TOKEN|ZBIERACZ_)' > /etc/environment && exec cron -f"]
    environment:
      API_URL: http://api:8000
      META_TOKEN: ${META_TOKEN:-}
    restart: unless-stopped
    depends_on:
      kolejka:
        condition: service_started

volumes:
  dane_bazy:
  stan_ai:
