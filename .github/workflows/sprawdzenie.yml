name: sprawdzenie

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  front:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  zaleznosci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install pip-audit==2.10.1
      # Osobne wywołanie dla każdego pliku: usługi przypinają sprzeczne wersje bibliotek.
      - run: pip-audit -r ai/requirements.txt
      - run: pip-audit -r api/requirements.txt
      - run: pip-audit -r odczyt/requirements.txt
      - run: pip-audit -r zbieracz/requirements.txt
      - run: pip-audit -r zbieracz/requirements-patrol.txt

  ai:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp .env.example .env
      - run: docker compose run --rm --no-deps ai python test_przewidz.py
      - run: docker compose run --rm --no-deps ai python test_main.py
      - run: docker compose run --rm --no-deps ai python test_rejestr.py
      - run: docker compose run --rm --no-deps ai python test_wymogi.py
      - run: docker compose run --rm --no-deps ai python test_osadzenia.py
      - run: docker compose run --rm --no-deps ai python test_temat.py
      - run: docker compose run --rm --no-deps ai python test_polecenia.py

  zbieracz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install pytest==9.2.0 httpx==0.28.1
      - run: python -m pytest zbieracz -q
